# CI — School Saathi (audit H-17, M-34)
# Minimal, zero-dependency: this repo has no npm dependencies and no build
# step, so there is deliberately no `npm install` / `npm test` step here.
# Every push and every PR runs:
#   1. `node --check` on the four plain-JS files (syntax check)
#   2. `node scripts/check-version.mjs` (version markers must agree, 11/11)
# The test-harness step (`npm test`) joins once the test harness lands
# in-repo (audit CR-8 — the harness is currently external, not in this repo).
# Branch protection ("Require status checks to pass" on main) is a GitHub-UI
# step for the repo owner — no repo file can turn it on.
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (node --check)
        run: |
          node --check app.js
          node --check qrgen.js
          node --check sw.js
          node --check scripts/check-version.mjs
      - name: Version markers check
        run: node scripts/check-version.mjs
