# School Saathi — Android cloud build (Capacitor)
#
# HOW TO RUN (manual only — this workflow does NOT run on push):
#   GitHub repo -> Actions tab -> "Android Build" -> "Run workflow".
#   The debug APK appears as a downloadable artifact on the run page.
#
# WHY MANUAL: a full Android/Gradle build on every push is wasteful.
# Run it when you want to test the native app, or before a release.
#
# JOBS:
#   1. build-debug — always runs. Builds an unsigned-for-release DEBUG APK
#      (Gradle signs debug builds with its own auto debug key, good enough
#      for installing on a test phone). No secrets needed.
#   2. build-release — runs ONLY when "Build signed release AAB" is ticked
#      on the Run workflow form. Builds a signed release AAB for the Play Store.
#
# RELEASE SIGNING (needed later, in Phase 8 — NOT set up here):
#   The release job needs these four repository secrets
#   (repo -> Settings -> Secrets and variables -> Actions):
#     ANDROID_KEYSTORE_BASE64   — the release keystore file (.keystore/.jks),
#                                  base64-encoded:  base64 -w0 file.keystore
#     ANDROID_KEY_ALIAS         — the key alias inside the keystore
#     ANDROID_KEYSTORE_PASSWORD — the keystore password
#     ANDROID_KEY_PASSWORD      — the key password
#   The keystore is created ONCE, by the app owner, with:
#     keytool -genkeypair -v -keystore school-saathi-release.keystore \
#       -alias school-saathi -keyalg RSA -keysize 2048 -validity 10000
#   *** KEEP THE KEYSTORE FILE AND ITS PASSWORDS BACKED UP SAFELY. ***
#   If the keystore is lost, the app can NEVER be updated on the Play
#   Store — Google rejects updates signed with a different key, even
#   under the same package ID (in.schoolsaathi.app). No keystore or key
#   material is created by, or stored in, this repo or this workflow.
#
# The Android project itself lives in android/ (added by `npx cap add android`).
# Its web assets are generated, not committed: each run does
#   npm run build-www   (copies the live site into www/)
#   npx cap sync android (copies www/ into android/app/src/main/assets/public)
name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build the signed release AAB (needs the 4 signing secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Populate www/ from the live site
        run: npm run build-www

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: school-saathi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    name: Release AAB (signed)
    needs: build-debug
    # Runs ONLY when "Build signed release AAB" is ticked on the Run workflow
    # form. NOTE: GitHub does NOT allow the `secrets` context in a job-level
    # `if`, so the gate is the workflow_dispatch input above — NOT the
    # signing secrets. Until the keystore decision is made and the four
    # secrets are added, leave the box unticked and this job is skipped.
    if: ${{ inputs.build_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Populate www/ from the live site
        run: npm run build-www

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/school-saathi-release.keystore

      - name: Build signed release AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew && ./gradlew :app:bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/app/school-saathi-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: school-saathi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
