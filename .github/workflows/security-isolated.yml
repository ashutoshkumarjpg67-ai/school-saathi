name: Isolated security regressions
on:
  push:
    branches: ['security/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: school_saathi_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: school_saathi_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node scripts/test-security-sql.mjs
